    <style>
        :root { 
            --alliance-red: #c9a554;
            --alliance-blue: #c9a554;
            --alliance-yellow: #f6c400;

            --alliance-green: #2ecc71; 
            --bg: #050505;
            --whatsapp-green: #075e54; 
            --dark: #000000; 
            --light-green: #054d44; 
            --card-bg: #111111;
            --text-color: #e0e0e0;
            --border-color: rgba(201,165,84,0.24);
            --font-ui: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
            --page-bg: radial-gradient(circle at 50% 0%, rgba(201,165,84,0.14), transparent 330px), linear-gradient(180deg, #050505 0%, #050505 100%);

            --panel-border: rgba(201,165,84,0.24);
            --text-primary: #f8fafc;
            --text-secondary: #b8c3d1;
            --text-muted: #8ea0b6;
            --input-bg: #0b1320;
            --input-border: rgba(201,165,84,0.3);
            --input-text: #f8fafc;
            --shadow-panel: 0 18px 42px rgba(0,0,0,0.28);
        }
        body.theme-dark {
            --page-bg: radial-gradient(circle at 50% 0%, rgba(201,165,84,0.14), transparent 330px), linear-gradient(180deg, #050505 0%, #050505 100%);
            --panel-bg: linear-gradient(145deg, rgba(13,28,41,0.96), rgba(8,18,27,0.98));
            --panel-bg-soft: rgba(17,24,39,0.94);
            --panel-border: rgba(201,165,84,0.24);
            --text-primary: #f8fafc;
            --text-secondary: #b8c3d1;
            --text-muted: #8ea0b6;
            --input-bg: #0b1320;
            --input-border: rgba(201,165,84,0.3);
            --input-text: #f8fafc;
            --shadow-panel: 0 18px 42px rgba(0,0,0,0.28);
        }
        body.theme-light {
            --page-bg: radial-gradient(circle at 50% 0%, rgba(240,199,94,0.18), transparent 340px), linear-gradient(180deg, #f7f4eb 0%, #eef4fb 100%);
            --panel-bg: linear-gradient(145deg, rgba(255,255,255,0.96), rgba(246,248,252,0.98));
            --panel-bg-soft: rgba(255,255,255,0.94);
            --panel-border: rgba(201,165,84,0.2);
            --text-primary: #142033;
            --text-secondary: #42546c;
            --text-muted: #6d7f95;
            --input-bg: rgba(255,255,255,0.98);
            --input-border: rgba(201,165,84,0.28);
            --input-text: #142033;
            --shadow-panel: 0 18px 40px rgba(15,23,42,0.1);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, button, div, section, header, main, article, aside, h1, h2, h3, p, span, small, strong, label {
            caret-color: transparent;
        }
        input, textarea {
            caret-color: var(--alliance-red);
            user-select: text;
        }
        html { scroll-behavior: smooth; }

        body { 
            font-family: var(--font-ui); 
            background: var(--page-bg);
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            color: var(--text-color); 
            margin:0; 
            padding: 14px; 
            padding-bottom: 120px; 
        }
        body.auth-mode, body.parent-mode, body.conversation-mode { padding: 0; overflow: hidden; }

        .auth-container, .selection-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:

                radial-gradient(circle at 50% 22%, rgba(0,0,0,0.92) 0, rgba(0,0,0,0.72) 26%, transparent 48%),
                linear-gradient(180deg, #020406 0%, #050505 48%, #05070a 100%);
            padding: 22px 12px;
        }
        body.auth-mode .auth-container, body.auth-mode .selection-screen { height: 100dvh; min-height: 100dvh; overflow: hidden; }
        .auth-shell { width: min(430px, 100%); display: flex; flex-direction: column; align-items: center; gap: 16px; }

        .auth-hero-image { width: 100%; height: 100%; object-fit: contain; object-position: center; filter: drop-shadow(0 18px 28px rgba(0,0,0,0.72)); opacity: 1; display: block; mix-blend-mode: normal; transform: none; border-radius: 0; }
        .brand-lockup { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; color: #fff; line-height: 1; }

        .brand-lockup-line { margin-top: 7px; display: flex; align-items: baseline; justify-content: center; gap: 5px; font-family: var(--font-ui); font-size: 20px; font-weight: 900; letter-spacing: 5px; text-transform: uppercase; white-space: nowrap; }
        .brand-lockup-line .brand-kids { display: inline-flex; font-size: inherit; font-weight: 900; letter-spacing: 0; text-transform: none; }

        .brand-kids .kids-i { color: #268ee8; }
        .brand-kids .kids-d { color: #e3262e; }
        .brand-kids .kids-s { color: #8bc91e; }

        .brand-unit-label { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; color: #f0c75e; font-size: 9px; font-weight: 800; letter-spacing: .7px; text-transform: uppercase; }

            .brand-lockup.compact .brand-lockup-mark { width: 34px; height: 32px; }
            .brand-lockup.compact .brand-lockup-name { font-size: 15px; letter-spacing: .8px; }
            .brand-lockup.compact .brand-lockup-line { margin-top: 3px; gap: 3px; font-size: 8px; letter-spacing: 1.25px; }
            .brand-unit-label { max-width: 100%; margin-top: 4px; font-size: 7px; letter-spacing: .35px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        }

        .auth-logo { width: 142px; height: 112px; object-fit: cover; object-position: 72% 34%; border-radius: 20px; border: 1px solid #2f2f2f; box-shadow: 0 14px 35px rgba(0,0,0,0.35); margin: 0 auto 22px; display: block; user-select: none; pointer-events: none; }
        .auth-kicker { color: var(--alliance-red); font-size: 11px; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; }
        .auth-title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; margin: 0; }
        .auth-subtitle { margin: 14px 0 0; color: #b8c0cd; font-size: 15px; font-weight: 600; text-transform: none; line-height: 1.35; }
        .auth-feature-row { display: none; }
        .auth-feature-row span { border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 12px 10px; color: #fff; font-size: 11px; font-weight: 900; text-transform: uppercase; background: rgba(0,0,0,0.18); }
        .role-grid { width: 100%; display: grid; grid-template-columns: 1fr; gap: 14px; background: transparent; border: 0; border-radius: 0; padding: 0; box-shadow: none; }
        .role-heading { display: none; }
        .role-heading strong { display: block; color: #fff; font-size: 21px; line-height: 1.1; }
        .role-heading small { display: block; margin-top: 6px; color: #9b9b9b; font-size: 11px; font-weight: 800; text-transform: uppercase; line-height: 1.45; }
        .btn-select { width: 100%; padding: 22px; border-radius: 22px; border: 1px solid rgba(201,165,84,0.34); background: linear-gradient(135deg, rgba(24,34,47,0.9), rgba(12,17,25,0.92)); color: white; font-size: 15px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: flex-start; gap: 20px; box-shadow: 0 16px 42px rgba(0,0,0,0.38), inset 0 1px 0 rgba(255,255,255,0.05); transition: 0.2s; text-align: left; min-height: 112px; }
        .btn-select:hover { transform: translateY(-1px); border-color: rgba(201,165,84,0.95); background: linear-gradient(135deg, rgba(30,43,61,0.95), rgba(14,22,34,0.95)); }
        .btn-select i { width: 72px; height: 72px; border-radius: 20px; display: grid; place-items: center; background: rgba(201,165,84,0.10); color: var(--alliance-red); font-size: 48px; flex: 0 0 auto; text-shadow: 0 12px 28px rgba(201,165,84,0.42); }
        .btn-select strong { display: block; color: #fff; font-size: 25px; line-height: 1.05; text-shadow: 0 8px 22px rgba(0,0,0,0.55); }
        .btn-select small { display: block; margin-top: 8px; color: #b5bdc9; font-size: 15px; font-weight: 500; text-transform: none; }
        .install-app-btn { width: 100%; min-height: 52px; border-radius: 18px; border: 1px solid rgba(201,165,84,0.5); background: rgba(201,165,84,0.12); color: #f7d46d; font-size: 13px; font-weight: 900; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 14px 34px rgba(0,0,0,0.28); }
        .install-app-btn:hover { border-color: rgba(201,165,84,0.95); background: rgba(201,165,84,0.18); transform: translateY(-1px); }
        .login-box { background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03)); padding: 26px; border-radius: 24px; width: 100%; text-align: center; box-shadow: 0 18px 45px rgba(0,0,0,0.45); border: 1px solid var(--border-color); cursor: default; transform: translateZ(0); }
        .login-box .auth-hero-frame { width: 188px; height: 224px; border-radius: 0; border: 0; margin-bottom: 4px; }
        .login-box input { display: block; position: relative; z-index: 1; cursor: text; transform: translateZ(0); }
        .login-heading { margin: 0 0 18px; color: #fff; font-size: 18px; position: relative; z-index: 1; }
        .back-link { font-size: 11px; margin-top: 18px; cursor: pointer; color: #777; font-weight: 800; text-transform: uppercase; }

        .header-main { text-align: center; margin: 16px auto 18px; max-width: 1180px; position: relative; display: flex; justify-content: center; align-items: center; min-height: 64px; }
        .app-brand-header { display: inline-flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 18px; border-radius: 16px; background: transparent; }
        .app-brand-header img { width: 42px; height: 42px; object-fit: contain; flex: 0 0 auto; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.54)); }
        .app-brand-header strong { display: block; color: #fff; font-size: 22px; line-height: 1; font-weight: 950; text-transform: uppercase; letter-spacing: 1.4px; text-shadow: 0 10px 30px rgba(0,0,0,0.48); }
        .app-brand-header small { display: block; margin-top: 5px; color: #f6c400; font-size: 8px; line-height: 1; font-weight: 950; text-transform: uppercase; letter-spacing: 0.8px; text-align: center; }
        .header-main h2 { display: none; }
        
        /* Botão de backup */
        .btn-settings-hidden { 
            position: absolute; 
            right: 15px; 
            top: 50%; 
            transform: translateY(-50%); 
            color: #444; /* Cor suave para não destacar tanto, mas visível */
            font-size: 18px; 
            cursor: pointer; 
            padding: 10px;
            transition: 0.3s;
        }
        .btn-settings-hidden:hover { color: var(--alliance-red); }

        .search-container { max-width: 1060px; margin: 0 auto 18px; background: rgba(24,24,24,0.86); border: 1px solid rgba(255,255,255,0.08); border-radius: 22px; padding: 14px; box-shadow: 0 18px 42px rgba(0,0,0,0.32); }
        .search-field { position: relative; }
        .search-input { width: 100%; padding: 18px 20px 18px 54px; border-radius: 18px; border: 1px solid #383838; background: #101010; color: white; font-size: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.04); outline: none; margin: 0; }
        .search-clear-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); border: 1px solid #333; background: #151515; color: #ddd; border-radius: 999px; padding: 8px 11px; font-size: 10px; font-weight: 900; text-transform: uppercase; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .search-clear-btn:hover { border-color: var(--alliance-red); color: #fff; background: #202020; }
        .search-field.has-clear .search-input { padding-right: 120px; }
        .search-input:focus { background: #151515; border-color: var(--alliance-red); box-shadow: 0 0 0 4px rgba(201,165,84,0.15); }
        .search-icon { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: #777; font-size: 17px; z-index: 1; }
        
        .filter-bar { display: flex; gap: 10px; overflow-x: auto; padding: 12px 2px 0; max-width: 1060px; margin: 0 auto; scrollbar-width: none; }
        .filter-bar::-webkit-scrollbar { display: none; }
        .filter-btn { padding: 10px 18px; border-radius: 999px; border: 1px solid #343434; background: #151515; font-size: 12px; font-weight: 900; white-space: nowrap; cursor: pointer; color: #8d8d8d; transition: 0.2s; }
        .filter-btn.active { background: var(--alliance-red); color: white; border-color: var(--alliance-red); box-shadow: 0 8px 22px rgba(201, 165, 84, 0.32); }
        .view-tabs { max-width: 850px; margin: 0 auto 18px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .view-tab { border: 1px solid var(--border-color); background: #171717; color: #888; border-radius: 18px; padding: 14px 12px; font-size: 12px; font-weight: 900; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .view-tab.active { background: #242424; color: #fff; border-color: var(--alliance-red); box-shadow: 0 8px 20px rgba(201, 165, 84, 0.18); }

        .container { max-width: 1060px; margin: auto; }
        .wide-container { max-width: 1100px; }
        .card { background: var(--card-bg); padding: 22px; border-radius: 24px; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); border: 1px solid var(--border-color); position: relative; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .student-top { display: flex; gap: 18px; align-items: center; margin-bottom: 20px; }
        .avatar-container { position: relative; width: 85px; height: 85px; flex-shrink: 0; }
        .avatar-preset { display: block; background-image: url('./kids-avatar-options.png') !important; background-repeat: no-repeat !important; background-size: 375% 250% !important; background-color: #f5f7fa !important; }
        .avatar-preset.preset-girl-1 { background-position: 11% 15% !important; }
        .avatar-preset.preset-girl-2 { background-position: 50% 15% !important; }
        .avatar-preset.preset-girl-3 { background-position: 89% 15% !important; }
        .avatar-preset.preset-boy-1 { background-position: 11% 96% !important; }
        .avatar-preset.preset-boy-2 { background-position: 50% 96% !important; }
        .avatar-preset.preset-boy-3 { background-position: 89% 96% !important; }

        .avatar-picker-modal > p { margin: -4px 0 18px; color: #9aa8b8; }
        .avatar-options-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }

        .avatar-upload-button { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; }

        .edit-badge { position:absolute; bottom:2px; right:2px; background:#c9a554; color:white; border-radius:50%; width:26px; height:26px; display:flex; align-items:center; justify-content:center; cursor:pointer; border:2px solid #1e1e1e; font-size: 11px; z-index: 2; }

<script type="text/babel">
    const beltOrder = ["Branca", "Cinza/Branca", "Cinza", "Cinza/Preta", "Amarela/Branca", "Amarela", "Amarela/Preta", "Laranja/Branca", "Laranja", "Laranja/Preta", "Verde/Branca", "Verde", "Verde/Preta"];

    const AVATAR_BOY = "https://cdn-icons-png.flaticon.com/512/3135/3135715.png";

        if (preset) return <span role="img" aria-label={alt || preset.label} className={`${className} avatar-preset ${preset.id}`}></span>;
        return <img src={src || (sexo === "F" ? AVATAR_GIRL : AVATAR_BOY)} className={className} alt={alt} />;
    };
    const AvatarOptions = ({ sexo, value, onSelect }) => (
        <div className="avatar-options-grid">
            {AVATAR_PRESETS.filter(option => option.sexo === sexo).map(option => (
                <button type="button" key={option.id} className={`avatar-option ${value === option.id ? "selected" : ""}`} onClick={() => onSelect(option.id)}>
                    <StudentAvatar src={option.id} sexo={sexo} alt={option.label} />
                    <span>{option.label}</span>
                </button>
            ))}
        </div>
    );
    const LOCAL_STUDENTS_KEY = "all_eagle_v22_s";
    const LOCAL_REPO_KEY = "all_eagle_v22_r";
    const LOCAL_USERS_KEY = "all_eagle_v22_users";
    const LOCAL_UNITS_KEY = "all_eagle_v22_units";
    const LOCAL_SELECTED_UNIT_KEY = "all_eagle_v22_selected_unit";
    const LOCAL_THEME_KEY = "all_eagle_v22_theme";

    const LOCAL_AUTO_BACKUP_KEY = "all_eagle_v22_auto_backup";
    const LOCAL_BACKUP_HISTORY_KEY = "all_eagle_v22_backup_history";
    const LOCAL_AUDIT_KEY = "all_eagle_v22_audit";
    const SUPABASE_STATE_ID = "alliance_mooca_kids_v22";
    const APPWRITE_ROW_ID = SUPABASE_STATE_ID;
    const APPWRITE_ENDPOINT = "https://nyc.cloud.appwrite.io/v1";
    const APPWRITE_PROJECT_ID = "6a5ae8f4000c42f9f83e";
    const APPWRITE_DATABASE_ID = "alliance_db";
    const APPWRITE_TABLE_ID = "app_state";
    const APPWRITE_BUCKET_ID = "alliance_files";
    const createDefaultSystemUsers = () => ([
        { id: 1, nome: "Administrador", login: "admin", senha: "admin", perfil: "Administrador", unidadeId: "all", status: "Ativo", createdAt: new Date().toISOString() }
    ]);

    // Preencha aqui se quiser deixar fixo no arquivo, ou defina window.SUPABASE_CONFIG antes deste script.
    const SUPABASE_URL = "https://oozzhujtyqsaxhkluxer.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_aKMcW5XwbBUj95uciZlO4w_YVOdz13J";

    const getSupabaseConfig = () => {
        const externalConfig = window.SUPABASE_CONFIG || {};
        return {
            url: externalConfig.url || SUPABASE_URL,
            anonKey: externalConfig.anonKey || SUPABASE_ANON_KEY
        };
    };

    const createSupabaseClient = () => {
        const { url, anonKey } = getSupabaseConfig();
        if (!url || !anonKey || !window.supabase?.createClient) return null;
        return window.supabase.createClient(url, anonKey);
    };

    const getAppwriteConfig = () => {
        const externalConfig = window.APPWRITE_CONFIG || {};
        return {
            endpoint: externalConfig.endpoint || APPWRITE_ENDPOINT,
            projectId: externalConfig.projectId || APPWRITE_PROJECT_ID,
            databaseId: externalConfig.databaseId || APPWRITE_DATABASE_ID,
            tableId: externalConfig.tableId || APPWRITE_TABLE_ID,
            bucketId: externalConfig.bucketId || APPWRITE_BUCKET_ID,
            rowId: externalConfig.rowId || APPWRITE_ROW_ID
        };
    };

    const createAppwriteServices = () => {
        const config = getAppwriteConfig();
        if (!config.endpoint || !config.projectId || !config.databaseId || !config.tableId) return null;
        const hasSdk = !!window.Appwrite?.Client;
        const client = hasSdk
            ? new window.Appwrite.Client().setEndpoint(config.endpoint).setProject(config.projectId)
            : null;
        return {
            config,
            client,
            storage: client && window.Appwrite.Storage ? new window.Appwrite.Storage(client) : null,
            ID: window.Appwrite?.ID || null
        };
    };

    const parseRemoteJson = (value, fallback) => {
        if (Array.isArray(value)) return value;
        if (!value) return fallback;
        try {
            const parsed = JSON.parse(value);
            return Array.isArray(parsed) ? parsed : fallback;
        } catch (e) {
            return fallback;
        }
    };

    const HYDRATION_TIMEOUT_MS = 4500;

    const withTimeout = (promise, timeoutMs = HYDRATION_TIMEOUT_MS, label = "Tempo limite excedido") => {
        let timer;
        const timeout = new Promise((_, reject) => {
            timer = setTimeout(() => reject(new Error(label)), timeoutMs);
        });
        return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
    };

    const appwriteFetch = async (config, path, options = {}, timeoutMs = HYDRATION_TIMEOUT_MS) => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        const response = await fetch(`${config.endpoint}${path}`, {
            ...options,
            signal: controller.signal,
            headers: {
                "Content-Type": "application/json",
                "X-Appwrite-Project": config.projectId,
                "X-Appwrite-Response-Format": "1.9.5",
                ...(options.headers || {})
            }
        }).finally(() => clearTimeout(timer));
        if (!response.ok) {
            const detail = await response.json().catch(() => ({}));
            const err = new Error(detail.message || `Appwrite HTTP ${response.status}`);
            err.status = response.status;
            err.detail = detail;
            throw err;
        }
        return response.status === 204 ? null : response.json();
    };

    const getAppwriteState = (config) => {
        return appwriteFetch(config, `/tablesdb/${config.databaseId}/tables/${config.tableId}/rows/${config.rowId}`);
    };

    const getAppwriteErrorMessage = (err) => {
        if (err?.name === "AbortError" || String(err?.message || "").toLowerCase().includes("tempo limite")) {
            return "Appwrite demorou para responder. Usando dados locais.";
        }
        const message = err?.detail?.message || err?.message || "erro desconhecido";
        const code = err?.status ? ` ${err.status}` : "";
        return `Erro Appwrite${code}: ${message}`;
    };

    const saveAppwriteState = async (config, students, repo, updatedAt) => {
        const data = {
            students: JSON.stringify(students),
            repo: JSON.stringify(repo),
            updated_at: updatedAt
        };
        return appwriteFetch(config, `/tablesdb/${config.databaseId}/tables/${config.tableId}/rows/${config.rowId}`, {
            method: "PUT",
            body: JSON.stringify({
                data,
                permissions: ['read("any")', 'update("any")', 'delete("any")']
            })
        });
    };

    const FILE_LIMITS = {
        avatar: 350 * 1024,
        chatImage: 650 * 1024,
        repoImage: 900 * 1024,
        genericFile: 1200 * 1024
    };

    const getBase64Bytes = (dataUrl = "") => {
        const base64 = String(dataUrl).split(",")[1] || "";
        return Math.ceil((base64.length * 3) / 4);
    };

    const formatBytes = (bytes) => {
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)} KB`;
        return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
    };

    const getDataSignature = (students, repo) => {
        try {
            return JSON.stringify({
                students: students || [],
                repo: repo || []
            });
        } catch (e) {
            return `${Date.now()}`;
        }
    };

    const buildBackupPayload = (students, repo, source = "manual", users = []) => ({
        source,
        app: "Alliance Jiu Jitsu Kids",
        version: "alliance_mooca_kids_v22",
        timestamp: new Date().toISOString(),
        students: students || [],
        repo: repo || [],
        users: users || [],
        audit: (() => {
            try { return JSON.parse(localStorage.getItem(LOCAL_AUDIT_KEY) || "[]"); }
            catch(e) { return []; }
        })()
    });

    const saveAutomaticLocalBackup = (students, repo, source = "auto-local", users = []) => {
        try {
            const payload = buildBackupPayload(students, repo, source, users);
            localStorage.setItem(LOCAL_AUTO_BACKUP_KEY, JSON.stringify(payload));

            const dayKey = payload.timestamp.slice(0, 10);
            const history = JSON.parse(localStorage.getItem(LOCAL_BACKUP_HISTORY_KEY) || "[]");
            const dailyHistory = Array.isArray(history) ? history.filter(item => item?.timestamp?.slice(0, 10) !== dayKey) : [];
            dailyHistory.unshift(payload);
            localStorage.setItem(LOCAL_BACKUP_HISTORY_KEY, JSON.stringify(dailyHistory.slice(0, 7)));
        } catch (e) {
            console.warn("Não foi possível salvar o backup local automático.", e);
        }
    };

    const getStoredArrayCount = (key) => {
        try {
            const value = JSON.parse(localStorage.getItem(key) || "[]");
            return Array.isArray(value) ? value.length : 0;
        } catch (e) {
            return 0;
        }
    };

    const dataUrlToFile = (dataUrl, fileName) => {
        const [meta, base64] = String(dataUrl).split(",");
        const mime = meta.match(/data:(.*?);base64/)?.[1] || "application/octet-stream";
        const binary = atob(base64 || "");
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return new File([bytes], fileName, { type: mime });
    };

    const buildStorageFileName = (file, type) => {
        const safeName = (file?.name || "arquivo").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9._-]/g, "_");
        const prefix = type === "avatar" ? "avatar" : type === "chat" ? "chat" : "repo";
        return `${prefix}_${Date.now()}_${safeName}`;
    };

    const compressImage = (base64Str, maxWidth = 900, quality = 0.58) => {
        return new Promise((resolve) => {
            const img = new Image();
            img.src = base64Str;
            img.onerror = () => resolve(base64Str);
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                if (width > maxWidth) {
                    height = Math.round((height * maxWidth) / width);
                    width = maxWidth;
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', quality));
            };
        });
    };

    function parseLocalDate(value) {
        if (!value) return null;
        if (/^\d{4}-\d{2}-\d{2}$/.test(value)) {
            const [year, month, day] = value.split("-").map(Number);
            return new Date(year, month - 1, day);
        }
        const parsed = new Date(value);
        return Number.isNaN(parsed.getTime()) ? null : parsed;
    }

    function getTodayISO() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, "0");
        const day = String(now.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
    }

    function formatDateBR(value) {
        const date = parseLocalDate(value);
        return date ? date.toLocaleDateString('pt-BR') : "";
    }

    function addDaysISO(value, days) {
        const date = parseLocalDate(value);
        const safeDays = Math.max(0, Number(days) || 0);
        if (!date || !safeDays) return "";
        const end = new Date(date);
        end.setDate(end.getDate() + safeDays);
        const year = end.getFullYear();
        const month = String(end.getMonth() + 1).padStart(2, "0");
        const day = String(end.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
    }

    function getBehaviorChallenge(student = {}) {
        const start = student.desafioInicio || "";
        const days = Number(student.desafioDias) || 0;
        if (!start || days <= 0) return null;
        const end = addDaysISO(start, days);
        const startDate = parseLocalDate(start);
        const endDate = parseLocalDate(end);
        const today = parseLocalDate(getTodayISO());
        const remaining = endDate ? Math.ceil((endDate - today) / 86400000) : null;
        return {
            title: student.desafioTitulo || "Desafio comportamental",
            start,
            days,
            end,
            active: !!student.desafioAtivo,
            reached: !!student.desafioAtivo && !!endDate && today >= endDate,
            remaining,
            elapsed: startDate ? Math.max(0, Math.floor((today - startDate) / 86400000) + 1) : 0
        };
    }

    function calculateAge(birthday) {
        const b = parseLocalDate(birthday);
        if(!b) return 0;
        const t = new Date();
        let age = t.getFullYear() - b.getFullYear();
        if (t.getMonth() < b.getMonth() || (t.getMonth() === b.getMonth() && t.getDate() < b.getDate())) age--;
        return age;
    }

    function getAutoCategory(nascimento, categoriaOverride = "Auto") {
        if (categoriaOverride && categoriaOverride !== "Auto") return categoriaOverride;
        const idade = calculateAge(nascimento);
        if (idade < 3 || idade > 15) return "Fora da regra";
        if (idade >= 3 && idade <= 4) return "Baby Eagle";
        if (idade >= 5 && idade <= 7) return "Little Eagle";
        if (idade >= 8 && idade <= 12) return "Eagle Warrior";
        if (idade >= 13 && idade <= 15) return "Eagle Youth";
        return "Fora da regra";
    }

    function getBeltFamily(faixa = "") {
        const f = faixa.toLowerCase();
        if (f.includes("amarela") || f.includes("laranja")) return "amarelaLaranja";
        if (f.includes("verde")) return "verde";
        if (f.includes("branca") || f.includes("cinza")) return "brancaCinza";
        return "desconhecida";
    }

    function getBeltVisualStyle(faixa = "") {
        const normalized = String(faixa).toLowerCase();
        const primary = normalized.startsWith("branca") ? "#f5f5f2"
            : normalized.startsWith("cinza") ? "#9ca3af"
            : normalized.startsWith("amarela") ? "#f4c430"
            : normalized.startsWith("laranja") ? "#f97316"
            : normalized.startsWith("verde") ? "#22a866"
            : "#58a6ff";
        const secondary = normalized.includes("/branca") ? "#f5f5f2"
            : normalized.includes("/preta") ? "#171717"
            : primary;
        return {
            "--belt-primary": primary,
            "--belt-secondary": secondary
        };
    }

    function getRuleInfo(nascimento, faixa, categoriaOverride = "Auto") {
        const idade = calculateAge(nascimento);
        const categoria = getAutoCategory(nascimento, categoriaOverride);
        const familia = getBeltFamily(faixa);
        const foraDaIdade = categoria === "Fora da regra";

        if (foraDaIdade) {
            return {
                categoria,
                aulasPorGrau: 0,
                elegivel: false,
                aviso: idade < 3 ? "Idade mínima: 3 anos" : "Programa Kids até 15 anos"
            };
        }

        if (categoria === "Baby Eagle") {
            if (familia === "brancaCinza") return { categoria, aulasPorGrau: 12, elegivel: true, aviso: "" };
            return { categoria, aulasPorGrau: 0, elegivel: false, aviso: "Baby Eagle usa Branca/Cinza" };
        }

        if (categoria === "Little Eagle" || categoria === "Eagle Warrior") {
            if (familia === "brancaCinza") return { categoria, aulasPorGrau: 15, elegivel: true, aviso: "" };
            if (familia === "amarelaLaranja") return { categoria, aulasPorGrau: 20, elegivel: true, aviso: "" };
            return { categoria, aulasPorGrau: 0, elegivel: false, aviso: "Verde é regra do Eagle Youth" };
        }

        if (categoria === "Eagle Youth") {
            if (familia === "brancaCinza") return { categoria, aulasPorGrau: 20, elegivel: true, aviso: "" };
            if (familia === "amarelaLaranja") return { categoria, aulasPorGrau: 22, elegivel: true, aviso: "" };
            if (familia === "verde") return { categoria, aulasPorGrau: 25, elegivel: true, aviso: "" };
        }

        return { categoria: "Fora da regra", aulasPorGrau: 0, elegivel: false, aviso: "Faixa fora da regra" };
    }

    function getRules(nascimento, faixa, categoriaOverride = "Auto") {
        return getRuleInfo(nascimento, faixa, categoriaOverride).aulasPorGrau;
    }

    function getPrevisaoGraduacao(aulasAtuais, nascimento, faixa, categoriaOverride = "Auto") {
        const ruleInfo = getRuleInfo(nascimento, faixa, categoriaOverride);
        const rules = ruleInfo.aulasPorGrau;
        if (!ruleInfo.elegivel || rules <= 0) return ruleInfo.aviso;
        const aulasSeguras = Math.max(0, Number(aulasAtuais) || 0);
        const totalAulasNecessarias = rules * 9;
        const aulasFaltantes = Math.max(0, totalAulasNecessarias - aulasSeguras);
        
        if (aulasFaltantes <= 0) return "Pronto para exame!";
        
        const dataPrevisa = new Date();
        let aulasContadas = 0;
        while (aulasContadas < aulasFaltantes) {
            dataPrevisa.setDate(dataPrevisa.getDate() + 1);
            if (classDays.includes(dataPrevisa.getDay())) aulasContadas++;
        }
        
        return dataPrevisa.toLocaleDateString('pt-BR');
    }

    function getGraduationProgress(aulasAtuais, nascimento, faixa, comp = {}, categoriaOverride = "Auto") {
        const ruleInfo = getRuleInfo(nascimento, faixa, categoriaOverride);
        const rules = ruleInfo.aulasPorGrau;
        if (!ruleInfo.elegivel || rules <= 0) {
            return {
                total: 0,
                feitas: 0,
                faltantes: 0,
                percentual: 0,
                elegivel: false,
                aviso: ruleInfo.aviso,
                aulasPorGrau: 0,
                previsao: ruleInfo.aviso
            };
        }
        const aulasSeguras = Math.max(0, Number(aulasAtuais) || 0);
        const total = rules * 9;
        const feitas = Math.min(aulasSeguras, total);
        const faltantes = Math.max(0, total - feitas);
        const aulasPercentual = total ? (feitas / total) * 100 : 0;
        const meritos = ["Rel", "Comp", "Notas", "Hab"];
        const meritosFeitos = meritos.filter(k => comp?.[k]).length;
        const percentual = Math.min(100, Math.round((aulasPercentual * 0.75) + ((meritosFeitos / meritos.length) * 25)));
        return {
            total,
            feitas,
            faltantes,
            percentual,
            elegivel: ruleInfo.elegivel,
            aviso: ruleInfo.aviso,
            aulasPorGrau: rules,
            previsao: getPrevisaoGraduacao(aulasSeguras, nascimento, faixa, categoriaOverride)
        };
    }

    function getPresenceDegreeStates(aulas = 0, rules = 1, savedStates = null) {
        if (Array.isArray(savedStates) && savedStates.length === 4) {
            return savedStates.map(state => Math.max(0, Math.min(2, Number(state) || 0)));
        }
        const graus = rules > 0 ? Math.floor(aulas / rules) : 0;
        return Array.from({length: 4}).map((_, i) => {
            if (graus > i + 4) return 2; // Vermelho sobreposto.
            if (graus > i) return 1; // Branco convencional.
            return 0;
        });
    }

    function getBehaviorDoneCount(comp = {}) {
        return ["Rel", "Comp", "Notas", "Hab"].filter(key => comp?.[key]).length;
    }

    function runAllianceRuleTests() {
        const results = [];
        const assertEqual = (name, actual, expected) => {
            const passed = actual === expected;
            results.push({ name, passed, actual, expected });
            if (!passed) throw new Error(`${name}: esperado ${expected}, recebido ${actual}`);
        };
        const birthdayForAge = (age) => {
            const date = new Date();
            date.setFullYear(date.getFullYear() - age);
            date.setDate(date.getDate() - 1);
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
        };

        assertEqual("3 a 4 anos: Baby Eagle", getAutoCategory(birthdayForAge(3)), "Baby Eagle");
        assertEqual("5 a 7 anos: Little Eagle", getAutoCategory(birthdayForAge(5)), "Little Eagle");
        assertEqual("8 a 12 anos: Eagle Warrior", getAutoCategory(birthdayForAge(8)), "Eagle Warrior");
        assertEqual("13 a 15 anos: Eagle Youth", getAutoCategory(birthdayForAge(13)), "Eagle Youth");
        assertEqual("16 anos: fora da regra", getAutoCategory(birthdayForAge(16)), "Fora da regra");
        assertEqual("Baby Branca/Cinza: 12 aulas", getRules(birthdayForAge(3), "Branca"), 12);
        assertEqual("Little Branca/Cinza: 15 aulas", getRules(birthdayForAge(5), "Cinza/Preta"), 15);
        assertEqual("Little Amarela/Laranja: 20 aulas", getRules(birthdayForAge(5), "Amarela/Branca"), 20);
        assertEqual("Youth Verde: 25 aulas", getRules(birthdayForAge(13), "Verde/Branca"), 25);
        assertEqual("Progresso completo Little: 100%", getGraduationProgress(135, birthdayForAge(5), "Branca", {Rel:true, Comp:true, Notas:true, Hab:true}).percentual, 100);
        assertEqual("Graus preservam brancos ao iniciar vermelhos", getPresenceDegreeStates(5 * 15, 15).join(","), "2,1,1,1");

        return { passed: results.length, results };
    }

    window.__ALLIANCE_RULES__ = { getAutoCategory, getRuleInfo, getRules, getGraduationProgress, getPresenceDegreeStates };
    window.__runAllianceRuleTests = runAllianceRuleTests;

    function buildBeltCycleRecord(student, nextBelt, changeType = "Graduacao") {
        const rules = getRules(student.nascimento, student.faixa, student.categoriaOverride);
        const progress = getGraduationProgress(student.aulas, student.nascimento, student.faixa, student.comp, student.categoriaOverride);
        const states = rules > 0 ? getPresenceDegreeStates(student.aulas, rules, student.presenceDegrees) : [0, 0, 0, 0];
        const todayIso = getTodayISO();
        return {
            id: `${Date.now()}_${Math.random().toString(16).slice(2)}`,
            faixa: student.faixa,
            proximaFaixa: nextBelt,
            turma: getAutoCategory(student.nascimento, student.categoriaOverride),
            dataInicio: student.cicloFaixaInicio || student.matricula || "",
            dataConclusao: todayIso,
            aulasFeitas: Math.max(0, Number(student.aulas) || 0),
            aulasNecessarias: progress.total || (rules > 0 ? rules * 9 : 0),
            percentualFinal: progress.percentual || 0,
            grausBrancos: states.filter(state => state >= 1).length,
            grausVermelhos: states.filter(state => state === 2).length,
            comportamentais: getBehaviorDoneCount(student.comp),
            tipo: changeType
        };
    }

        return safeAulas % safeRules;

        const handleFile = async (file, type, id = null) => {
            if(!file) return;
            const isImage = file.type.startsWith('image/');
            const genericLimit = type === "repo" ? FILE_LIMITS.genericFile : FILE_LIMITS.chatImage;
            if (!isImage && file.size > genericLimit) {
                alert(`Arquivo muito grande. Limite: ${formatBytes(genericLimit)}.`);
                return;
            }
            const reader = new FileReader();
            document.getElementById('compress-loader').style.display = 'block';
            reader.onload = async (e) => {
                try {
                    let finalData = e.target.result;
                    if (isImage) {
                        const imageOptions = type === "avatar"
                            ? { maxWidth: 420, quality: 0.5, limit: FILE_LIMITS.avatar }
                            : type === "repo"
                                ? { maxWidth: 1000, quality: 0.58, limit: FILE_LIMITS.repoImage }
                                : { maxWidth: 820, quality: 0.55, limit: FILE_LIMITS.chatImage };
                        finalData = await compressImage(finalData, imageOptions.maxWidth, imageOptions.quality);
                        if (getBase64Bytes(finalData) > imageOptions.limit) {
                            finalData = await compressImage(finalData, Math.round(imageOptions.maxWidth * 0.75), 0.45);
                        }
                        if (getBase64Bytes(finalData) > imageOptions.limit) {
                            alert(`Imagem muito grande mesmo apos otimizar. Limite: ${formatBytes(imageOptions.limit)}.`);
                            return;
                        }
                    } else if (getBase64Bytes(finalData) > genericLimit) {
                        alert(`Arquivo muito grande. Limite: ${formatBytes(genericLimit)}.`);
                        return;
                    }

                    let uploadedFile = null;
                    try {
                        const uploadFile = isImage
                            ? dataUrlToFile(finalData, buildStorageFileName(file, type))
                            : new File([file], buildStorageFileName(file, type), { type: file.type || "application/octet-stream" });
                        uploadedFile = await uploadAppwriteFile(uploadFile, type);

                        console.warn("Falha ao enviar arquivo para o Appwrite Storage. Mantendo arquivo no JSON local.", uploadErr);
                    }

                        setStudents(prev => prev.map(s => s.id === id ? { ...s, avatar: uploadedFile?.fileUrl || finalData, avatarFileId: uploadedFile?.fileId || s.avatarFileId } : s));

                                <label className="field-label">Avatar opcional</label>
                                <AvatarOptions sexo={editingStudent.sexo || "M"} value={editingStudent.avatar || ""} onSelect={avatar => setEditingStudent({...editingStudent, avatar, avatarFileId: ""})} />
                            </div>
                            <div className="form-grid">
                                <div>
                                    <label className="field-label">Status</label>
                                    <select value={editingStudent.status || "Ativo"} onChange={e => setEditingStudent({...editingStudent, status: e.target.value})}>
                                        {statusOptions.map(status => <option key={status} value={status}>{status}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="field-label">Matrícula</label>
                                    <input type="date" value={editingStudent.matricula || ""} onChange={e => setEditingStudent({...editingStudent, matricula: e.target.value})} />
                                </div>
                                <div>
                                    <label className="field-label">Última presença</label>
                                    <input type="date" value={editingStudent.ultimaPresenca || ""} onChange={e => setEditingStudent({...editingStudent, ultimaPresenca: e.target.value})} />
                                </div>
                                <div>
                                    <label className="field-label">Responsável</label>
                                    <input placeholder="Nome do responsável" value={editingStudent.responsavel || ""} onChange={e => setEditingStudent({...editingStudent, responsavel: e.target.value})} />
                                </div>
                                <div>
                                    <label className="field-label">WhatsApp do responsável</label>
                                    <input placeholder="WhatsApp do responsável" value={editingStudent.telefone || ""} onChange={e => setEditingStudent({...editingStudent, telefone: e.target.value})} />
                                </div>
                                <div>
                                    <label className="field-label">E-mail do responsável</label>
                                    <input placeholder="E-mail do responsável" value={editingStudent.email || ""} onChange={e => setEditingStudent({...editingStudent, email: e.target.value})} />
                                </div>
                            </div>
                            <textarea placeholder="Observação interna / necessidade especial" value={editingStudent.necessidades || ""} onChange={e => setEditingStudent({...editingStudent, necessidades: e.target.value})}></textarea>
                            <textarea placeholder="Observações internas do professor" value={editingStudent.observacoesInternas || ""} onChange={e => setEditingStudent({...editingStudent, observacoesInternas: e.target.value})}></textarea>
                            <label className="check-row">
                                <input type="checkbox" checked={!!editingStudent.autorizacaoImagem} onChange={e => setEditingStudent({...editingStudent, autorizacaoImagem: e.target.checked})} />
                                Autorização de uso de imagem
                            </label>
                            <label className="field-label">Turma</label>
                            <select value={editingStudent.categoriaOverride || "Auto"} onChange={e => setEditingStudent({...editingStudent, categoriaOverride: e.target.value})}>
                                {categoryOptions.map(c => <option key={c} value={c}>{c === "Auto" ? `Automática: ${getAutoCategory(editingStudent.nascimento)}` : c}</option>)}
                            </select>
                            <label className="field-label">Faixa</label>
                            <select value={editingStudent.faixa} onChange={e => setEditingStudent({...editingStudent, faixa: e.target.value})}>
                                {beltOrder.map(f => <option key={f} value={f}>{f}</option>)}
                            </select>
                            <button className="btn-full" style={{background: 'var(--alliance-green)', color:'white'}} onClick={() => {
                                if(!editingStudent.nome.trim() || !editingStudent.nascimento) return alert("Preencha tudo!");
                                const alunoOriginal = students.find(s => s.id === editingStudent.id);
                                const hoje = new Date().toLocaleDateString('pt-BR');
                                const logs = [];
                                let alunoAtualizado = normalizeStudent({ ...editingStudent, nome: editingStudent.nome.trim() });

                                if (alunoOriginal && alunoOriginal.faixa !== alunoAtualizado.faixa) {
                                    if (!window.confirm(`Alterar a faixa de ${alunoOriginal.nome} de ${alunoOriginal.faixa} para ${alunoAtualizado.faixa}? O ciclo atual será encerrado e os contadores serão reiniciados.`)) return;
                                    logs.push(createAuditLog("Faixa alterada manualmente", "Faixa", alunoOriginal.faixa, alunoAtualizado.faixa));
                                    const { presenceDegrees, ...semGrausPresenca } = alunoAtualizado;
                                    alunoAtualizado = { ...semGrausPresenca, aulas: 0, comp: {}, cicloFaixaInicio: getTodayISO(), beltHistory: [...(alunoOriginal.beltHistory || []), buildBeltCycleRecord(alunoOriginal, alunoAtualizado.faixa, "Alteracao manual")] };
                                }

                                const categoriaAnterior = alunoOriginal?.categoriaOverride || "Auto";
                                const categoriaNova = alunoAtualizado.categoriaOverride || "Auto";
                                if (alunoOriginal && categoriaAnterior !== categoriaNova) {
                                    logs.push(createAuditLog("Turma alterada", "Turma", categoriaAnterior === "Auto" ? "Automática" : categoriaAnterior, categoriaNova === "Auto" ? "Automática" : categoriaNova));
                                }

                                if (alunoOriginal && getStudentUnitId(alunoOriginal) !== getStudentUnitId(alunoAtualizado)) {
                                    logs.push(createAuditLog("Unidade alterada", "Unidade", getStudentUnitName(alunoOriginal, units), getStudentUnitName(alunoAtualizado, units)));
                                }

                                const statusAnterior = alunoOriginal?.status || "Ativo";
                                const statusNovo = alunoAtualizado.status || "Ativo";
                                if (alunoOriginal && statusAnterior !== statusNovo) {
                                    logs.push(createAuditLog("Status alterado", "Status", statusAnterior, statusNovo));
                                }

                                const desafioDepois = getBehaviorChallenge(alunoAtualizado);
                                const desafioMudou = alunoOriginal && (
                                    !!alunoOriginal.desafioAtivo !== !!alunoAtualizado.desafioAtivo ||
                                    (alunoOriginal.desafioTitulo || "") !== (alunoAtualizado.desafioTitulo || "") ||
                                    (alunoOriginal.desafioGrau || "Rel") !== (alunoAtualizado.desafioGrau || "Rel") ||
                                    (alunoOriginal.desafioInicio || "") !== (alunoAtualizado.desafioInicio || "") ||
                                    String(alunoOriginal.desafioDias || "") !== String(alunoAtualizado.desafioDias || "")
                                );
                                if (desafioMudou) {
                                    logs.push(`DESAFIO COMPORTAMENTAL: ${desafioDepois?.active ? `${desafioDepois.title} de ${formatDateBR(desafioDepois.start)} ate ${formatDateBR(desafioDepois.end)}` : "desativado"} | ${hoje}`);
                                }

                                if (logs.length) alunoAtualizado = { ...alunoAtualizado, historico: [...(alunoOriginal?.historico || []), ...logs] };
                                setStudents(students.map(s => s.id === editingStudent.id ? alunoAtualizado : s));
                                setModalOpen(null);
                            }}>ATUALIZAR</button>
                            <button className="btn-full" onClick={() => setModalOpen(null)}>FECHAR</button>
                        </div>
                    </div>
                )}

                {avatarPickerStudent && (
                    <div className="modal-overlay" onClick={() => setAvatarPickerStudent(null)}>
                        <div className="modal-content avatar-picker-modal" onClick={event => event.stopPropagation()}>
                            <h3>Escolher avatar</h3>
                            <p>Selecione uma opção para {avatarPickerStudent.nome} ou envie uma foto própria.</p>
                            <AvatarOptions
                                sexo={avatarPickerStudent.sexo}
                                value={avatarPickerStudent.avatar}
                                onSelect={avatar => selectStudentAvatar(avatarPickerStudent.id, avatar)}
                            />
                            <label className="btn-full avatar-upload-button">
                                <i className="fas fa-camera"></i> ENVIAR FOTO
                                <input
                                    type="file"
                                    accept="image/*"
                                    hidden
                                    onChange={event => {
                                        handleFile(avatarPickerStudent.id, event.target.files[0], 'avatar');
                                        setAvatarPickerStudent(null);
                                    }}
                                />
                            </label>
                            <button className="btn-full" onClick={() => setAvatarPickerStudent(null)}>FECHAR</button>
                        </div>
                    </div>
                )}

                {viewImage && (
                    <div className="modal-overlay" onClick={() => setViewImage(null)}>
                        <img src={viewImage.fileUrl || viewImage.fileData} style={{maxWidth:'100%', maxHeight:'90vh', borderRadius:'10px'}} />
                    </div>
                )}
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
